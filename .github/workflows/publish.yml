name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test release-tag checker
        run: python3 -m unittest discover -s scripts -p 'test_check_release_tag.py'

      - name: Validate release identity
        env:
          PAFT_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/paft-release-metadata.json"
          python3 scripts/check_release_tag.py --metadata "$RUNNER_TEMP/paft-release-metadata.json" --tag "$PAFT_RELEASE_TAG"

  test:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Clean up runner image
        run: |
          df -h
          rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests and doctests
        run: just test

      - name: Test the isolated facade consumer
        run: |
          cargo test --locked -p paft-facade-consumer
          cargo test --locked -p paft-facade-consumer --all-features

      - name: Run lints
        run: just lint

  configurations:
    name: Consumer configurations
    needs: preflight
    uses: ./.github/workflows/configurations.yml

  publish:
    needs: [preflight, test, configurations]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io (dry-run)
        run: cargo publish --locked --workspace --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --workspace

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Create GitHub Releases based on changelog
        uses: taiki-e/create-gh-release-action@v1.11.0
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
